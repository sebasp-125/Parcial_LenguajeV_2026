<section class="min-h-screen flex items-center justify-center bg-gray-100 p-6">

  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden grid md:grid-cols-2">

    <aside class="relative hidden md:flex items-center justify-center bg-red-900 overflow-hidden">

      <div
        class="absolute inset-0 bg-cover bg-center opacity-60"
        style="background-image:url('https://plus.unsplash.com/premium_photo-1675367606936-7bb2285696d9?q=80&w=1223&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');">
      </div>

      <h1
        class="relative text-6xl lg:text-8xl font-black text-transparent bg-clip-text bg-center bg-cover leading-none"
        style="background-image:url('https://plus.unsplash.com/premium_photo-1675367606936-7bb2285696d9?q=80&w=1223&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');"
      >
        ShoeStore
      </h1>

    </aside>


    <div class="p-10 flex flex-col justify-center">

      <h2 class="text-3xl font-bold text-gray-800 mb-2">
        Iniciar sesión
      </h2>

      <p class="text-gray-500 mb-8">
        Ingresa tus credenciales
      </p>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-2">
            Correo electrónico
          </label>

          <input
            type="email"
            formControlName="Email"
            placeholder="correo@email.com"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-2">
            Contraseña
          </label>

          <input
            type="password"
            formControlName="Password"
            placeholder="********"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition"
          >
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-red-900 text-white py-3 rounded-lg font-semibold hover:bg-red-700 active:scale-95 transition transform shadow-lg"
        >
          {{ loading ? 'Cargando...' : 'Iniciar sesión' }}
        </button>

      </form>

    </div>

  </div>

</section>
