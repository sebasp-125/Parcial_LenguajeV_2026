
<div class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-8">

    <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">
      Bienvenido
    </h2>

    <p class="text-center text-gray-500 mb-6">
      Inicia sesión para continuar
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Correo electrónico
        </label>
        <input 
          type="email"
          formControlName="Email"
          placeholder="correo@email.com"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Contraseña
        </label>
        <input 
          type="password"
          formControlName="Password"
          placeholder="********"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
        >
      </div>

      <button 
        type="submit"
        [disabled]="loading"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 active:scale-95 transition transform"
      >
       {{ loading ? 'Cargando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <p class="text-sm text-gray-500 text-center mt-6">
      ¿No tienes cuenta?
      <a href="#" class="text-indigo-600 font-medium hover:underline">
        Regístrate
      </a>
    </p>

  </div>

</div>
